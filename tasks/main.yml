---
- name: Update the server
  ansible.builtin.apt:
    upgrade: safe
    update_cache: yes

- name: Install required system packages
  ansible.builtin.apt:
    name: '{{ item }}'
    state: latest
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common
    - python3-debian
    - unzip

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Remove old Docker repository list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker-ce.list
    state: absent

- name: Add Docker Repository
  ansible.builtin.deb822_repository:
    name: docker-ce
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_distribution | lower }}
    suites: '{{ ansible_distribution_release }}'
    components: stable
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Update apt and install docker-ce
  ansible.builtin.apt:
    name: docker-ce
    state: latest
    update_cache: yes

- name: Adjust Docker logging strategy
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json

- name: Restart the Docker daemon
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Create /var/docker folder
  ansible.builtin.file:
    dest: /var/docker
    state: directory
    owner: root
    group: docker
    mode: 0774

- name: Copy health check script
  ansible.builtin.copy:
    src: healthchecks.py
    dest: /var/docker/healthchecks.py
